name: Deploy example bookshelf to GitHub Pages

# Builds the demo bookshelf (examples/) and publishes it to GitHub Pages.
# The bookshelf is a landing index.html listing PDF titles; each links to a
# self-contained annotated reader. Everything is static and relative-linked, so
# it works at the Pages base path with no server rewrites.
#
# No Python is needed: the drawn PDFs (examples/pdfs/) and their glyph geometry
# (examples/geometry.json) are committed. Only the viewer bundle + readers are
# rebuilt here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build viewer bundle + demo bookshelf
        run: npm run build:examples
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
